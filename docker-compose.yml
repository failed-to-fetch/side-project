x-backend-image: &backend-image
  build:
    context: ./backend
    target: dev
  volumes:
    - ./backend:/app

x-database-url: &database-url postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-appdb}

services:

  backend-migrate:
    <<: *backend-image
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    environment:
      DATABASE_URL: *database-url
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network

  backend:
    <<: *backend-image
    container_name: backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: *database-url
      REDIS_URL: redis://redis:6379
      WATCHFILES_FORCE_POLLING: "true"
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      GITHUB_REDIRECT_URI: http://localhost:8000/auth/github/callback
      FRONTEND_URL: http://localhost:3000
      AUTH_SERVICE_URL: http://auth:3001
    healthcheck:
      # The python image has no curl or pg_isready, so probe the API with the stdlib.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      backend-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      auth:
        condition: service_healthy
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      args:
        # Baked into the bundle at build time; rebuild the image after changing it.
        VITE_AUTH_URL: http://localhost:3001
    container_name: frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - app-network

  postgres:
    build:
      context: ./services/postgres
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-appdb}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  redis:
    build:
      context: ./services/redis
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  auth-migrate:
    build:
      context: ./services/auth
      target: migrate
    environment: &auth-env
      DATABASE_URL: *database-url
      BETTER_AUTH_URL: http://localhost:3001
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      GITHUB_LOGIN_CLIENT_ID: ${GITHUB_LOGIN_CLIENT_ID}
      GITHUB_LOGIN_CLIENT_SECRET: ${GITHUB_LOGIN_CLIENT_SECRET}
      GITLAB_LOGIN_CLIENT_ID: ${GITLAB_LOGIN_CLIENT_ID}
      GITLAB_LOGIN_CLIENT_SECRET: ${GITLAB_LOGIN_CLIENT_SECRET}
      BITBUCKET_LOGIN_CLIENT_ID: ${BITBUCKET_LOGIN_CLIENT_ID}
      BITBUCKET_LOGIN_CLIENT_SECRET: ${BITBUCKET_LOGIN_CLIENT_SECRET}
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network

  auth:
    build:
      context: ./services/auth
      target: prod
    container_name: auth
    ports:
      - "3001:3001"
    environment:
      <<: *auth-env
      PORT: 3001
    healthcheck:
      # 127.0.0.1, not localhost: Alpine resolves localhost to IPv6 first, and the server listens on IPv4.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/api/auth/ok"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
      auth-migrate:
        condition: service_completed_successfully
    networks:
      - app-network

volumes:
  postgres-data:
  redis-data:

networks:
  app-network: